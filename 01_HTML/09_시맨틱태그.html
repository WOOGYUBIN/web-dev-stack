<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시맨틱태그</title>
  </head>
  <body>
    <h2>레이아웃 1 : div 사용</h2>
    <!-- 시맨틱 태그가 없던 시절 무조건 div로 구조를 잡음   -->
    <div id="header">
      <!-- 위쪽 부분을 보통 header라고 함-->
      <h1>LOGO</h1>
      <div>GNB (Global Navigation Bar) - 메인 메뉴창임</div>
    </div>
    <!-- id : 각자의 이름들  (해당 태그에 이름을 지을 수 있는 속성은 id임)
         class : 같이 묶고자 하는 애들. ex. 우리반 -->
    <div id="main">Main 영역</div>
    <!-- section으로 영역 잡기/  section 안에서 구분짓고 싶을때 class 쓰고 article이라고 쓰기 <div>-->
    <div id="section">
      <div class="article">Article1</div>
      <div class="article">Article2</div>
    </div>
    <!-- 홈페이지 사이드바, 추천 글, 광고 등 만들고 싶을때 aside를 씀
     보통 본문 옆 또는 하단에 있음 -->
    <div id="aside">Aside</div>
    <div id="footer">Footer</div>

    <h2>레이아웃 2 : 시맨틱 태그 사용</h2>
    <!-- 
        header 
        -페이지 상단 영역 
        -보통 로고나 GNB(Global Navigation Bar) 포함 --<nav></nav>로 표시 
        -모든 페이지에 공통적으로 존재 
    -->
    <header>
      <h1>LOGO</h1>
      <!-- 
            nav
            - 메인 내비게이션(GNB) 또는 섹션 내 내비게이션(LNB: Local Navigation Bar)
              페이지 상단, 좌측 등 어디든 가능 
        -->
      <nav></nav>
    </header>

    <!-- 
        main
        - 해당 문서의 주요 콘텐츠 
        - 주로 페이지 내에 한번 사용 
      -->
    <main></main>
    <!-- 
            section, article 
            - 콘텐츠 그룹화할 때 사용
            * section과 article은 구분없이 사용 가능 
            단, 구역안에 구역을 나누고 싶을때는 <section>안에 <article>을 쓰는 편 
        -->
    <section>
      <article></article>
      <article></article>
    </section>

    <!--
            aside
            - 본문과 간접적으로 관련된 콘텐츠   
        -->
    <aside></aside>

    <!-- 
        footer
        - 페이지 하단 영역
        - 회사 정보, 저작권, 이용약관, 연락처 등... 
    -->
    <footer></footer>
  </body>
</html>
