<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>조건문</title>
  </head>
  <body>
    <h1>조건문</h1>
    <h2>1. if / else</h2>
    <script>
      /* 여러 줄 주석일 때*/
      // 한줄 주석일 때

      /*
            if(조건) {
                 조건이 true 인 경우
            } else {
                 조건이 false 경우
            }

             else(생략 가능) : 그렇지 않으면 이라는 뜻임. else에는 조건이 안걸림 
       */

      let age = 18;
      if (age > 19) {
        console.log("성인");
      } else {
        console.log("미성년자");
      }

      // 삼항 연산자 : 조건 ? 조건이 true : 조건이 false
      age = 20;
      const result = age > 19 ? "성인" : "미성년자"; // 해당조건이 true이면 뒤에 ?가 나옴. : ->이게 else(그게 아니면)를 뜻함
      console.log(result);
    </script>

    <h2>2. else if</h2>
    <script>
      // 조건이 하나 이상인 경우에 else if를 씀
      /*
        if(조건 A) {
           조건 A가 true
        } else if(조건 B) {
           (조건 A가 false이면서) 조건 B가 true
        } else {
            (앞에 나왔던) 모든 조건이 false
        } */

      // 조건문 문제) 20세 이상이면 성인, 14세 이상이면 청소년, 8세 이상이면 어린이, 그 외에는 유아
      //   age = prompt ("나이를 입력해주세요") => 사이트에서 나이 값을 입력하게 함15

      //방법1
      age = prompt("나이를 입력해주세요");
      if (age >= 20) {
        console.log("성인");
      } else if (age >= 14) {
        //  20세 미만이면서 14세 이상인 경우
        console.log("청소년");
      } else if (age >= 8) {
        // 14세 미만이면서 8세 이상인 경우
        console.log("어린이");
      } else {
        console.log("유아");
      }

      //방법2
      let result2;
      if (age >= 20) {
        result2 = "성인";
      } else if (age >= 14) {
        //  20세 미만이면서 14세 이상인 경우
        result2 = "청소년";
      } else if (age >= 8) {
        // 14세 미만이면서 8세 이상인 경우
        result2 = "어린이";
      } else {
        result2 = "유아";
      }
      console.log(result2);

      //방법3 (삼항연산자)
      console.log(
        age >= 20 ? "성인" : age > 14 ? "청소년" : age >= 8 ? "어린이" : "유아"
      );
    </script>

    <h2>3. switch</h2>
    <script>
      // break;를 걸어야지 앞에 조건이 맞을 경우 값이 도출됨
      /*
                    switch(데이터값-문자 or 숫자가 들어감){
                     case 조건A(=값=데이터):
                            조건A가 true인 경우 실행
                            break;
                     case 조건B(=값=데이터):
                            조건B가 true인 경우 실행
                             break;
                     default:
                          (앞에 있는) 모든 조건이 false
                    }  */
      const number = prompt("숫자를 입력하세요");
      //  조건문 문제) number 값이 짝수이면 "짝수", 홀수이면 "홀수", 그게 아니면 "숫자가 아닙니다".

      /* if(number 값이 짝수이면 -> number 값을 2로 나눴을 때 나머지가 0인 경우) {
                         "짝수"
                     } else if (number 값이 홀수이면-> number값을 2로 나눴을 때 나머지가 1인 경우) {
                         "홀수"}
                         else {
                          "숫자가 아닙니다."
                         } */

      if (number % 2 === 0) {
        console.log("짝수");
      } else if (number % 2 === 1) {
        console.log("홀수");
      } else {
        console.log("숫자가 아닙니다.");
      }

      // 연산자가 들어가도 식이 아니라 데이터값으로 됨
      /* switch(데이터) {
        case: 값
        값이 일치하는 경우
        break;
      } */

      switch (number % 2) {
        case 0:
          console.log("짝수");
          break;
        case 1:
          console.log("홀수");
          break;
        default:
          console.log("숫자가 아닙니다.");
      }
    </script>
    <h2>4. 중첩 if</h2>
    <script>
      // 중첩 if :조건문 안에 조건문을 넣은 형태
      // 조건문 문제) 아이디가 user1, 비밀번호가 1234인 경우만 "로그인 성공"
      // 비밀번호가 틀리면 "비밀번호 오류"
      // 아이디가 틀리면 "아이디 오류"

      //중첩 if를 안쓰는 경우 (그냥 if만 쓸 경우)
      /* if( 아이디가 user1, 비밀번호가 1234인 경우) {
         "로그인 성공"
       } else if (비밀번호가 틀리면) {
         "비밀번호 오류"
       } else if (아이디가 틀리면) {
         "아이디 오류"
       }  */

      //방법1
      let id = "user1";
      let pw = "1234";

      if (id === "user1" && pw === "1234") {
        console.log("로그인 성공");
      } else if (pw !== "1234") {
        console.log("비밀번호 오류");
      } else if (id !== "user1") {
        console.log("아이디 오류");
      }

      /* 조건은 위에서 아래로 입력된 값 대로 출력되기 때문에 아이디 입력해달라는 문구 다음에 비밀번호를 입력해달라는 문구를 넣으면
         쓴대로 된다 그렇기에 아이디는 잘못 입력했을 때, 비밀번호를 입력해달라는 문구가 안 뜨게 할려면
         순서를 바꿔서 작성해줘야 함 
      
      id = prompt("아이디를 입력해주세요");
      pw = prompt("비밀번호를 입력해주세요");
      if (id === "user1") {
        console.log("아이디 맞음");
      } else {
        console.log("아이디 오류");
      } */

      // if (pw === "1234") 에서 비밀번호가 숫자값만 있게 하려면 if (Number(pw) === 1234) 라고 작성

      if (id === "user1") {
        if (pw === "1234") {
          console.log("로그인 성공");
        } else {
          console.log("비밀번호 오류");
        }
      } else {
        console.log("아이디 오류");
      }

      // 아래처럼 하면 아이디 입력 요구 다음 그대로 비밀번호가 뜬다
      /*  
      id = prompt("아이디를 입력해주세요");
      pw = prompt("비밀번호를 입력해주세요");
      if (id === "user1") {
        if (pw === "1234") {
          console.log("로그인 성공");
        } else {
          console.log("비밀번호 오류");
        }
      } else {
        console.log("아이디 오류");
      } */

      //아이디 입력후 아이디가 맞았을 때 비밀번호가 뜨게 하는 방법
      id = prompt("아이디를 입력해주세요");
      if (id === "user1") {
        pw = prompt("비밀번호를 입력해주세요");
        if (pw === "1234") {
          console.log("로그인 성공");
        }
      } else if (id === "") {
        console.log("아이디를 입력하지 않았습니다");
      } else {
        console.log("아이디 오류");
      }
    </script>

    <h2>5. break가 없는 switch</h2>
    <script>
      const fruit = "banana";

      switch (fruit) {
        case "apple":
          console.log("사과");
          break;
        case "orange":
          console.log("오렌지");
          break;
        case "banana":
          console.log("바나나");
          break;
        case "kiwi":
          console.log("키위");
          break;
      } //default가 else랑 같아서 생략가능함
    </script>
  </body>
</html>
