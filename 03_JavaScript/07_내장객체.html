<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내장객체</title>
  </head>
  <body>
    <h1>내장 객체</h1>
    <p>자바스크립트에서 제공하는 기본 내장 객체들</p>
    <h2>Math 객체</h2>
    <script>
      console.log("최소값 : ", Math.min(5, 7, -1, -8)); // -8
      console.log("최대값 : ", Math.max(5, 7, -1, -8)); // 7
      console.log("절대값 : ", Math.abs(-7.57367454)); // 7.57367454
      console.log("반올림 : ", Math.round(2.897)); // 3
      console.log("버림 : ", Math.floor(2.897)); // 2
      console.log("올림 : ", Math.ceil(2.897)); // 3
      console.log("0~1 랜덤 : ", Math.random()); // 0~1 사이 숫자가 새로고침 할때마다 바뀜
      // 1 ~ 10까지 랜덤수가 필요하다면
      // 0 <= Math.random() < 1
      //  0 * 10  <= Math.random * 10 < 1* 10
      // 0 <= Math.random() * 10 < 10
      // 1 <= Math.random() * 10 +1 < 11
      // console.log(Math.random() * 10 + 1); - 소수점이 있음
      console.log(Math.floor(Math.random() * 10) + 1);

      // 5 ~ 15까지 랜덤수가 필요하다면
      console.log(Math.floor(Math.random() * 10) + 5); // 여기서 5는 "~부터", 10은 "~까지" 숫자 넣으면 됨
    </script>

    <h2>Date 객체</h2>
    <script>
      const now = new Date(); // 현재 시간나옴
      console.log("현재 :", now);
      console.log(
        `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일`
      ); //month가 0부터 시작함. 1월이 0월임 그래서 +1을 해야 정확한 월이 나옴
      const date = new Date(2025, 11, 16, 17, 50, 0); //특정날짜 :  Tue Dec 16 2025 17:50:00 GMT+0900 (한국 표준시)
      //특정날짜로 지정가능함(년월일시분초 순서) 월문제로 12월 16일로 뜨고 싶으면 12를 11로 수정해야함
      console.log("특정날짜 : ", date);

      const date2 = new Date("2025-12-16"); //특정날짜 2 :  Tue Dec 16 2025 09:00:00 GMT+0900 (한국 표준시)
      console.log("특정날짜 2 : ", date2);

      const date3 = new Date("2025-12-16T17:50:00"); //특정날짜 3:  Tue Dec 16 2025 17:50:00 GMT+0900 (한국 표준시)
      console.log("특정날짜 3: ", date3);
    </script>

    <h2>Timer</h2>
    // 1000단위로 1000 = 1초 (몇초후에 실행할건지)
    <script>
      //setTimeout : 일정 시간 후 1회 동작
      setTimeout(() => {
        console.log("3초 후!");
      }, 3000);

      //setInterval : 일정 시간마다 동작
      let sec = 0;
      setInterval(() => {
        console.log(`${++sec}초`);
      }, 1000);
    </script>

    <h2>String 객체</h2>
    <script>
      const str = "Hello, JavaScript!"; //문자 길이는 공백도 포함 (H부터가 0임)
      console.log("문자 길이: ", str.length);
      console.log("포함 여부: ", str.includes("Java")); //true  ex. Java라는 단어가 있는지 포함여부
      console.log("위치 : ", str.indexOf("Script")); //11  몇번째에서 시작되고 있는지 알려줌
      console.log("일부 : ", str.slice(7, 17)); // 7번째부터 17번째까지 문자를 가져옴
      console.log("대문자: ", str.toUpperCase()); //HELLO, JAVASCRIPT!  모든 글자를 대문자로 바꿈
    </script>

    <h2>JSON 객체</h2>
    <script>
      // 데이터를 문자열로 변환 및 파싱
      const obj = {
        name: "김주현",
        age: 12,
      };
      const jsonStr = JSON.stringify(obj);
      console.log(obj); // 객체 형태임
      console.log(jsonStr); //객체 형태가 문자열로 변환됨
      const parsed = JSON.parse(jsonStr);
      console.log(parsed); // 문자열에서 객체 방식으로 바뀜
    </script>
  </body>
</html>
