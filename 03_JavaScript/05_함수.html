<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수</title>
  </head>
  <body>
    <h1>함수</h1>
    <script>
      // 1. 매개변수(parameter) 없고, 리턴값(=결과값)이 없는 경우

      // 함수는 function을 사용.
      /* function 함수명(매개변수=파라미터 값= 인자값)
         {console.log("")}
         함수명(); */
      function sayHello() {
        console.log("안녕하세요~");
      }
      sayHello(); // -> 함수 호출 (함수를 실행하려면 함수를 호출해야 함)

      // 2. 매개변수 있고, 리턴값이 없는 경우
      function greet(name = "성모") {
        console.log(name + "님, 안녕하세요~");
      }
      greet("규빈"); // 파라미터값(=인자 값)이 name으로 들어감
      greet(); /* 파라미터를 보내지 않으면 원래는 undefined가 뜸
                  greet(name "성모") -> name에 기본값(ex. 성모)을 설정하면 인자값(파라미터)을 받지 않았을때 기본값이 뜸
                */
      // 3. 매개변수 없고, 리턴값이 있는 경우
      function getNumber() {
        return 1049;
      }
      getNumber(); //1049 - getNumber() 자체가 1049임 (검사탭에 안뜸)
      console.log(getNumber()); //1049 숫자가 뜨려면 console을 입력해야 함

      // 4. 매개변수 있고, 리턴값이 있는 경우
      //참고로 파라미터는 여러개 넣을 수 있음 아래는 a값, b값 두개의 값을 받겠다는 뜻임
      function add(a, b) {
        return a + b; // 이 두 파라미터값을 더한 값을 내보낸다는 뜻임
      }
      add(30, 50); //호출할 때 첫번째 30은 a. 두번째 50은 b임
      console.log(add(30, 50)); // 80
    </script>

    <h2>1. 변수의 유효범위(Scope)</h2>
    <script>
      const num1 = 100; //함수 밖(여기저기 쓸 수 있기 때문에 "전역 변수"라고 함)

      // {}중괄호가 변수의 유효범위임
      // 해당 범위내에 있는 변수가 우선순위임
      function sample1() {
        const num1 = 200; // 함수안에서 변수 지정 가능. num1은 sample1 함수 내부 지역 변수임
        console.log(`sample1 내부 : ${num1}`); // 200
      }
      console.log(`sample1 외부: ${num1}`); // 100
      sample1();
    </script>

    <h2>2. 선언적 vs 익명 vs 화살표 함수</h2>
    <script>
      // 선언적 함수(Function Declaration)
      // 선언적 함수만 호이스팅 가능함: 코드 해석 시점에 메모리에 등록, 선언 이전에 호출이 가능
      /* 즉, 호이스팅 - 함수를 정의한것보다 console을 위로 올리면(=호출하면) 정상으로 작동 

      console.log("선언적 함수: ", multiply(3, 4));
      function multiply(a, b) {
        return a * b;
      }
      */

      function multiply(a, b) {
        return a * b;
      }
      console.log("선언적 함수: ", multiply(3, 4));

      // 익명 함수(Function Expression) --함수명이 없음 functio 바로()가 옴
      /* function (a, b) {} 이렇게 하면 함수명이 없기 때문에 출력이 안됨 그래서
         const라는 변수의 값을 담아서 사용 */
      const substract = function (a, b) {
        return a - b;
      };
      console.log("익명 함수: ", substract(5, 8));

      // 화살표 함수(Arrow Function) -제일 많이 쓰임
      // function 대신 =>(화살표)를 사용
      // 화살표 함수도 변수의 값을 담아서 사용

      //방법1
      const divide = (a, b) => {
        return a / b;
      };
      console.log("화살표 함수:", divide(12, 3));

      /* 방법2 (완전 생략하는 방법) -중괄호{}랑 return값이랑 생략가능
      const divide = (a, b) => a / b;     
      */
    </script>

    <h2>3. 콜백 함수</h2>
    <script>
      // 콜백 함수: 파라미터 부분에 변수가 아니라 함수가 들어감 즉. 함수안에 함수가 들어감
      // 콜백함수는 다른 함수의 인자로 전달되는 함수
      // 변수명을 callback으로 지정

      function callFunc(callback) {
        console.log("함수 호출 전");
        callback();
        console.log("함수 호출 후");
      }

      function call() {
        console.log("안녕하세요 ~ 콜백 함수 호출!");
      }

      callFunc(call);
    </script>

    <h2>4. 배열 관련 콜백 함수들</h2>
    <script>
            const numbers = [1, 2, 3, 4, 5];
            // 1. 값을 하나씩 출력해보기
            for (let i = 0; i < numbers.length; i++) {
              console.log(numbers[i]);
            }
            // => forEach((값, 인덱스, 배열) => {})
            numbers.forEach((value, index, array) => {
              console.log(value);
            });
            // 2. 배열의 값을 각각 2배로 만들어서 출력해보기

            // 방법 1
            /* for (const index in numbers) {
              console.log(numbers[index] * 2);
            } */
      -----------------------------------------------------------
            // 방법2
            // const doubled = [];
            const doubled = [];
            for (const index in numbers) {
              doubled[index] = numbers[index] * 2; // = doubled.push(numbers[index] * 2);
            }
            console.log(doubled);
      -------------------------------------------------------------
            // => map ((값, 인덱스, 배열) => {}) : 각 요소를 가공하여 새로운 배열 반화
            //   numbers.map((value, index, array) => {});
            const doubleMap = numbers.map((value, index, array) => {
              return value * 2;
            });
            console.log(doubleMap);

            // 3. 배열의 짝수만 출력해보기
           for (const value of numbers) {
             if(value % 2 === 0) console.log(value);
           }
           // => filter ((값, 인덱스, 배열) => {}) : 조건에 만족하는 요소만 추출해서 새로운 배열 반환
           // -> 리턴한 값들이 true인 것만 모아서
          const evenFilter = numbers.filter((value, index, array) => {
            return value % 2 === 0;
           });
           console.log(evenFilter)

            // 4. 배열의 총합 구하기
            let sum = 0;
            for(let i = 0; i < numbers.length; i++) {
                sum += numbers[i];
            }
            console.log(sum);
            // => reduce ((누적된 값, 현재값, 인덱스=idx, 배열) => {}) : 배열의 각 요소를 누적하여 하나의 값으로 반환
            const sumReduce = numbers.reduce((acc, cur, idx, arr) => {
                console.log(`acc : ${acc}, cur : ${cur}`)
                return acc + cur;
            }, 0);
            console.log(sumReduce);
    </script>
  </body>
